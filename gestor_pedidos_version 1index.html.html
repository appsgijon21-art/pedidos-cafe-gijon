<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedidos — El Gran Café Gijón</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f8f7f4;color:#1a1a1a;font-size:14px}
header{background:#fff;border-bottom:1px solid #e8e6e0;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}
.logo{font-size:15px;font-weight:700}
.sub{font-size:11px;color:#888;margin-top:1px}
.vtog{display:flex;gap:5px}
.vtbtn{padding:5px 13px;border:1px solid #d8d5ce;border-radius:8px;background:transparent;font-size:12px;color:#666;cursor:pointer;font-family:inherit}
.vtbtn.on{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
main{max-width:820px;margin:0 auto;padding:1rem 14px 5rem}

/* LOGIN */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:60vh}
.login-card{background:#fff;border:1px solid #e8e6e0;border-radius:16px;padding:2rem;width:100%;max-width:340px;text-align:center}
.login-title{font-size:18px;font-weight:700;margin-bottom:6px}
.login-sub{font-size:12px;color:#888;margin-bottom:1.5rem}
.login-opts{display:flex;flex-direction:column;gap:10px}
.usbtn{padding:12px;border:1px solid #e8e6e0;border-radius:10px;background:#f8f7f4;cursor:pointer;font-size:14px;font-family:inherit;font-weight:600;transition:all .15s}
.usbtn:hover{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.usbtn .role{font-size:11px;font-weight:400;color:#888;display:block;margin-top:2px}
.usbtn:hover .role{color:#ccc}

/* TABS */
.tabs{display:flex;gap:5px;margin-bottom:.75rem;flex-wrap:wrap}
.tab{padding:5px 14px;border:1px solid #d8d5ce;border-radius:8px;background:#fff;cursor:pointer;font-size:13px;color:#666;font-family:inherit}
.tab.on{background:#1a1a1a;color:#fff;border-color:#1a1a1a;font-weight:600}
.srch{width:100%;padding:8px 12px;border:1px solid #d8d5ce;border-radius:8px;font-size:13px;background:#fff;color:#1a1a1a;margin-bottom:.75rem;font-family:inherit}
.srch:focus{outline:none;border-color:#1a1a1a}

/* PRODUCTOS */
.supblk{border:1px solid #e8e6e0;border-radius:12px;margin-bottom:8px;overflow:hidden;background:#fff}
.suphdr{display:flex;justify-content:space-between;align-items:center;padding:9px 13px;background:#f4f3ef;cursor:pointer;user-select:none}
.supname{font-size:13px;font-weight:600}
.supphone{font-size:11px;color:#888;margin-top:1px}
.prodlist{padding:5px}
.prodrow{display:grid;grid-template-columns:1fr 95px 30px;gap:5px;align-items:center;padding:4px 7px;border-radius:6px}
.prodrow:hover{background:#f4f3ef}
.prodname{font-size:12px}
.qinput{padding:4px 6px;border:1px solid #d8d5ce;border-radius:6px;font-size:12px;text-align:center;width:100%;background:#fff;font-family:inherit}
.qinput:focus{outline:none;border-color:#1a1a1a}
.qinput.hv{border-color:#0F6E56;background:#E1F5EE;color:#085041;font-weight:600}
.xbtn{width:26px;height:26px;border-radius:50%;border:1px solid #d8d5ce;background:#fff;cursor:pointer;font-size:14px;color:#999;display:flex;align-items:center;justify-content:center;font-family:inherit}
.xbtn:hover{background:#fee;border-color:#f99;color:#c00}

/* BARRA INFERIOR */
.btmbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e8e6e0;padding:10px 16px;display:flex;gap:10px;align-items:center;z-index:50}
.cbtn{padding:8px 20px;background:#1D9E75;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.cbtn:hover{background:#0F6E56}
.cbtn:disabled{background:#aaa;cursor:not-allowed}
.cnt{font-size:12px;color:#666}
.userindicator{margin-left:auto;font-size:11px;color:#888;display:flex;align-items:center;gap:6px}
.userdot{width:8px;height:8px;border-radius:50%;background:#1D9E75;display:inline-block}
.logout-link{font-size:11px;color:#aaa;cursor:pointer;text-decoration:underline;margin-left:8px}
.logout-link:hover{color:#c00}

/* HISTORIAL */
.hfilters{display:flex;gap:6px;margin-bottom:.75rem;flex-wrap:wrap;align-items:center}
.hfbtn{padding:4px 12px;border:1px solid #d8d5ce;border-radius:20px;background:#fff;font-size:11px;color:#666;cursor:pointer;font-family:inherit}
.hfbtn.on{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1rem}
.scard{background:#fff;border:1px solid #e8e6e0;border-radius:10px;padding:11px 13px}
.slbl{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.04em}
.sval{font-size:22px;font-weight:700;margin-top:2px}
.hcard{border:1px solid #e8e6e0;border-radius:12px;margin-bottom:10px;overflow:hidden;background:#fff}
.hcardh{padding:9px 13px;background:#f4f3ef;display:flex;justify-content:space-between;align-items:center}
.hdlbl{font-size:13px;font-weight:700}
.hmeta{font-size:11px;color:#888;margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dbtn{padding:3px 10px;font-size:11px;border:1px solid #d8d5ce;border-radius:6px;background:#fff;color:#666;cursor:pointer;font-family:inherit}
.dbtn:hover{background:#fee;color:#c00;border-color:#f99}
.htable{width:100%;border-collapse:collapse;font-size:12px}
.htable th{text-align:left;padding:7px 10px;border-bottom:1px solid #e0ddd5;color:#666;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.htable td{padding:6px 10px;border-bottom:1px solid #f0eee8}
.htable tr:last-child td{border-bottom:none}
.htable tr:hover td{background:#f8f7f4}
.bdg{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:700;display:inline-block}
.bdg-BARRA{background:#dbeafe;color:#1e40af}
.bdg-COCINA{background:#fef3c7;color:#92400e}
.bdg-LIMPIEZA{background:#dcfce7;color:#166534}
.bdg-CC{background:#ede9fe;color:#5b21b6}
.bdg-user{background:#f4f3ef;color:#444;font-size:10px;padding:2px 7px;border-radius:20px;font-weight:600;display:inline-block}

/* MODAL */
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:200}
.overlay.show{display:flex}
.mdl{background:#fff;border-radius:16px;border:1px solid #e8e6e0;padding:1.5rem;width:94%;max-width:480px;max-height:82vh;overflow-y:auto}
.mtitle{font-size:16px;font-weight:700;margin-bottom:4px}
.msub{font-size:12px;color:#888;margin-bottom:1rem}
.mitem{display:grid;grid-template-columns:1fr auto auto;gap:6px;padding:7px 0;border-bottom:1px solid #f0eee8;align-items:center;font-size:12px}
.mitem:last-child{border-bottom:none}
.mqty{font-weight:700;color:#0F6E56;min-width:60px;text-align:right;font-size:13px}
.msup{font-size:10px;color:#888;margin-top:2px}
.macts{display:flex;gap:8px;justify-content:flex-end;margin-top:1rem}
.cancbtn{padding:7px 16px;border:1px solid #d8d5ce;border-radius:8px;background:#fff;font-size:13px;cursor:pointer;color:#666;font-family:inherit}
.savebtn{padding:7px 20px;background:#1D9E75;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.savebtn:hover{background:#0F6E56}
.savebtn:disabled{background:#aaa;cursor:not-allowed}
.rmbtn{font-size:11px;color:#bbb;cursor:pointer;padding:3px 5px;border-radius:4px}
.rmbtn:hover{color:#c00;background:#fee}

/* ESTADOS */
.empty{text-align:center;padding:3rem 1rem;color:#888;font-size:13px;background:#fff;border:1px solid #e8e6e0;border-radius:12px}
.loading{text-align:center;padding:2rem;color:#888;font-size:13px}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:8px 18px;border-radius:8px;font-size:12px;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.syncing{font-size:11px;color:#aaa;margin-left:auto}

@media(max-width:480px){
  .sgrid{grid-template-columns:repeat(2,1fr)}
  .prodrow{grid-template-columns:1fr 80px 26px}
}
</style>
</head>

// ─── ESTADO ────────────────────────────────────────────────────
const SECS=['BARRA','COCINA','LIMPIEZA','CC'];
let currentUser=null, sec='BARRA', qtys={}, coll={}, view='cat', histFilter='todos';

// ─── LOGIN ─────────────────────────────────────────────────────
function login(name){
  currentUser=name;
  localStorage.setItem('gcg_user', name);
  document.getElementById('view-login').style.display='none';
  document.getElementById('view-app').style.display='';
  document.getElementById('nav-tabs').style.display='flex';
  document.getElementById('btmbar').style.display='flex';
  document.getElementById('username-indicator').textContent=name;
  rt(); rp();
}

function logout(){
  currentUser=null;
  localStorage.removeItem('gcg_user');
  qtys={};
  document.getElementById('view-login').style.display='flex';
  document.getElementById('view-app').style.display='none';
  document.getElementById('nav-tabs').style.display='none';
  document.getElementById('btmbar').style.display='none';
  sv('cat');
}

// ─── VISTAS ────────────────────────────────────────────────────
function sv(v){
  view=v;
  document.getElementById('vcat').style.display=v==='cat'?'':'none';
  document.getElementById('vhist').style.display=v==='hist'?'':'none';
  document.getElementById('vbcat').className='vtbtn'+(v==='cat'?' on':'');
  document.getElementById('vbhist').className='vtbtn'+(v==='hist'?' on':'');
  if(v==='hist') loadHistory();
}

// ─── TABS SECCIÓN ──────────────────────────────────────────────
function rt(){
  document.getElementById('stabs').innerHTML=SECS.map(s=>
    `<button class="tab${s===sec?' on':''}" onclick="ss('${s}')">${s}</button>`
  ).join('');
}
function ss(s){sec=s;rt();rp()}

// ─── RENDER PRODUCTOS ──────────────────────────────────────────
function rp(){
  const q=document.getElementById('srch').value.toLowerCase();
  const sups=D[sec]||[];
  let html='';
  sups.forEach(sup=>{
    const fp=q ? sup.products.filter(p=>p.toLowerCase().includes(q)||sup.name.toLowerCase().includes(q)) : sup.products;
    if(!fp.length) return;
    const open=coll[sup.name]!==true;
    html+=`<div class="supblk">
      <div class="suphdr" onclick="ts(this)">
        <div>
          <div class="supname">${sup.name}</div>
          ${sup.phone?`<div class="supphone">📞 ${sup.phone}</div>`:''}
        </div>
        <span style="font-size:11px;color:#aaa">${open?'▲':'▼'}</span>
      </div>`;
    if(open){
      html+=`<div class="prodlist">`;
      fp.forEach(p=>{
        const k=sec+'|||'+sup.name+'|||'+p;
        const v=qtys[k]||'';
        const ke=k.replace(/"/g,'&quot;').replace(/'/g,'&#39;');
        html+=`<div class="prodrow">
          <div class="prodname">${p}</div>
          <input class="qinput${v?' hv':''}" type="text" placeholder="cantidad" value="${v}"
            onchange="sq(this,'${ke}')" oninput="sq(this,'${ke}')">
          <button class="xbtn" onclick="cq('${ke}')">×</button>
        </div>`;
      });
      html+=`</div>`;
    }
    html+=`</div>`;
  });
  if(!html) html=`<div style="padding:1rem;text-align:center;color:#888;font-size:12px">Sin resultados</div>`;
  document.getElementById('parea').innerHTML=html;
  uc();
}

function ts(hdr){
  const name=hdr.querySelector('.supname').textContent;
  coll[name]=!coll[name]; rp();
}

function sq(inp,k){
  const v=inp.value.trim();
  if(v){qtys[k]=v; inp.classList.add('hv')}
  else{delete qtys[k]; inp.classList.remove('hv')}
  uc();
}

function cq(k){delete qtys[k]; rp()}

function uc(){
  const n=Object.values(qtys).filter(v=>v).length;
  document.getElementById('icnt').textContent=n?`${n} producto${n>1?'s':''} en el pedido`:'';
}

// ─── CONFIRMAR PEDIDO ──────────────────────────────────────────
function oc(){
  const items=Object.entries(qtys).filter(([k,v])=>v);
  if(!items.length){toast('No hay productos en el pedido');return;}
  const now=new Date();
  const dl=now.toLocaleDateString('es-ES',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  document.getElementById('msub').textContent=dl+' · '+currentUser;
  let rows='';
  items.forEach(([k,qty])=>{
    const[s,sup,p]=k.split('|||');
    rows+=`<div class="mitem">
      <div><div>${p}</div><div class="msup">${sup} · <span class="bdg bdg-${s}">${s}</span></div></div>
      <div class="mqty">${qty}</div>
      <span class="rmbtn" onclick="rm(this,'${k.replace(/'/g,"&#39;")}')">✕</span>
    </div>`;
  });
  document.getElementById('mitems').innerHTML=rows;
  document.getElementById('overlay').classList.add('show');
}

function rm(btn,k){
  delete qtys[k];
  btn.closest('.mitem').remove();
  if(!document.querySelectorAll('#mitems .mitem').length){cm();rp();return;}
  uc();
}

function cmcheck(e){if(e.target===document.getElementById('overlay'))cm()}
function cm(){document.getElementById('overlay').classList.remove('show')}

async function so(){
  const items=Object.entries(qtys).filter(([k,v])=>v);
  if(!items.length) return;
  const btn=document.getElementById('savebtn');
  btn.disabled=true; btn.textContent='Guardando…';
  const now=new Date();
  const dl=now.toLocaleDateString('es-ES',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  const grupoId=Date.now().toString();
  const rows=items.map(([k,qty])=>{
    const[s,sup,p]=k.split('|||');
    return{fecha_label:dl, fecha_iso:now.toISOString(), usuario:currentUser,
           seccion:s, proveedor:sup, producto:p, cantidad:qty, grupo_id:grupoId};
  });
  const ok=await sbInsert(rows);
  btn.disabled=false; btn.textContent='Guardar pedido ✓';
  if(ok){
    qtys={}; cm(); rp();
    toast('✓ Pedido guardado correctamente');
    sv('hist');
  } else {
    toast('Error al guardar. Comprueba la conexión.');
  }
}

// ─── HISTORIAL ─────────────────────────────────────────────────
async function loadHistory(){
  document.getElementById('harea').innerHTML=`<div class="loading">Cargando historial…</div>`;
  try {
    const data=await sbGet();
    renderHistory(data);
  } catch(e){
    document.getElementById('harea').innerHTML=`<div class="empty">Error al cargar. Comprueba la conexión.</div>`;
  }
}

function renderHistory(data){
  // Filtro usuario
  const filteredData = histFilter==='todos' ? data : data.filter(r=>r.usuario===histFilter);

  // Stats
  const grupos=[...new Set(data.map(r=>r.grupo_id))];
  const misGrupos=[...new Set(data.filter(r=>r.usuario===currentUser).map(r=>r.grupo_id))];
  document.getElementById('sgrid').innerHTML=`
    <div class="scard"><div class="slbl">Total pedidos</div><div class="sval">${grupos.length}</div></div>
    <div class="scard"><div class="slbl">Mis pedidos</div><div class="sval">${misGrupos.length}</div></div>
    <div class="scard"><div class="slbl">Líneas totales</div><div class="sval">${data.length}</div></div>`;

  // Filtros
  document.getElementById('hfilters').innerHTML=`
    <span style="font-size:11px;color:#888">Ver:</span>
    <button class="hfbtn${histFilter==='todos'?' on':''}" onclick="setFilter('todos')">Todos</button>
    <button class="hfbtn${histFilter==='Andrés'?' on':''}" onclick="setFilter('Andrés')">Solo Andrés</button>
    <button class="hfbtn${histFilter==='Jenna'?' on':''}" onclick="setFilter('Jenna')">Solo Jenna</button>`;

  if(!filteredData.length){
    document.getElementById('harea').innerHTML=`<div class="empty">No hay pedidos registrados aún.</div>`;
    return;
  }

  // Agrupar por grupo_id
  const grouped={};
  filteredData.forEach(r=>{
    if(!grouped[r.grupo_id]) grouped[r.grupo_id]={
      id:r.grupo_id, fecha:r.fecha_label, iso:r.fecha_iso,
      usuario:r.usuario, items:[]
    };
    grouped[r.grupo_id].items.push(r);
  });

  const grupos_ord=Object.values(grouped).sort((a,b)=>b.iso.localeCompare(a.iso));
  let html='';
  grupos_ord.forEach(g=>{
    const secs=[...new Set(g.items.map(i=>i.seccion))];
    const canDelete=g.usuario===currentUser;
    let rows='';
    g.items.forEach(i=>{
      rows+=`<tr>
        <td>${i.producto}</td>
        <td>${i.proveedor}</td>
        <td><span class="bdg bdg-${i.seccion}">${i.seccion}</span></td>
        <td style="font-weight:700;color:#0F6E56">${i.cantidad}</td>
      </tr>`;
    });
    html+=`<div class="hcard">
      <div class="hcardh">
        <div>
          <div class="hdlbl">${g.fecha}</div>
          <div class="hmeta">
            <span class="bdg-user">${g.usuario}</span>
            ${g.items.length} producto${g.items.length>1?'s':''}
            ${secs.map(s=>`<span class="bdg bdg-${s}">${s}</span>`).join('')}
          </div>
        </div>
        ${canDelete?`<button class="dbtn" onclick="delPedido('${g.id}')">Eliminar</button>`:''}
      </div>
      <div style="overflow-x:auto">
        <table class="htable">
          <thead><tr><th>Producto</th><th>Proveedor</th><th>Sección</th><th>Cantidad</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
  });
  document.getElementById('harea').innerHTML=html;
}

function setFilter(f){
  histFilter=f;
  loadHistory();
}

async function delPedido(id){
  if(!confirm('¿Eliminar este pedido?')) return;
  const ok=await sbDelete(id);
  if(ok){ toast('Pedido eliminado'); loadHistory(); }
  else toast('Error al eliminar');
}

// ─── UTILS ─────────────────────────────────────────────────────
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

// ─── INIT ──────────────────────────────────────────────────────
const savedUser=localStorage.getItem('gcg_user');
if(savedUser) login(savedUser);
